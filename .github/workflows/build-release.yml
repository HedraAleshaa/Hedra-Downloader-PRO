name: Build & Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build macOS App Bundle
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed \
            --name "Hedra Downloader PRO" \
            --icon "icon.icns" \
            --add-data "icon.icns:." \
            --add-data "icon.png:." \
            --collect-all customtkinter \
            --collect-all PIL \
            "Hedra Downloader PRO.pyw"

      - name: Package macOS ZIP
        run: |
          cd dist
          zip -r -y Hedra-Downloader-PRO-v2.0-macOS.zip "Hedra Downloader PRO.app"
          cp ../README.md .
          zip -u Hedra-Downloader-PRO-v2.0-macOS.zip README.md

      - name: Upload macOS Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Hedra-Downloader-PRO-v2.0-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Windows Executable
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "Hedra Downloader PRO 2.0" --icon "icon.ico" --add-data "icon.ico;." --add-data "icon.png;." --collect-all customtkinter --collect-all PIL "Hedra Downloader PRO.pyw"

      - name: Package Windows ZIP
        shell: powershell
        run: |
          Compress-Archive -Path "dist/Hedra Downloader PRO 2.0.exe", "ffmpeg.exe", "ffprobe.exe", "icon.ico", "icon.png", "README.md" -DestinationPath "dist/Hedra-Downloader-PRO-v2.0-Windows.zip" -Force

      - name: Upload Windows Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Hedra Downloader PRO 2.0.exe
            dist/Hedra-Downloader-PRO-v2.0-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
